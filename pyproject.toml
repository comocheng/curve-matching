[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curve-matching"
dynamic = ["version"]
description = "Domain-agnostic penalized-spline curve fitting and dissimilarity metrics for comparing reference and candidate data"
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "Lekia Prosper", email = "lekia.p@northeastern.edu"},
]
keywords = ["curve-fitting", "curve-comparison", "splines", "model-validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[dependency-groups]
test = ["pytest", "pytest-cov"]
lint = ["ruff"]

[project.urls]
Homepage = "https://github.com/<your-org-or-user>/curve-matching"
Repository = "https://github.com/<your-org-or-user>/curve-matching"
Issues = "https://github.com/<your-org-or-user>/curve-matching/issues"

[tool.hatch.version]
path = "src/curve_matching/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/curve_matching"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "NPY", "PD"]

[tool.ruff.lint.isort]
known-first-party = ["curve_matching"]

[tool.coverage.run]
source = ["src/curve_matching"]
branch = true
